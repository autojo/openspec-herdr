id = "openspec.picker"
name = "OpenSpec Picker"
version = "1.0.0"
min_herdr_version = "0.9.0"
description = "Track OpenSpec changes across your panes and start an apply with one click"
platforms = ["linux", "macos"]

[[startup]]
command = ["bash", "observer.sh"]

[[panes]]
id = "picker"
title = "OpenSpec"
placement = "popup"
command = ["bash", "picker.sh"]

[[actions]]
id = "open"
title = "OpenSpec: open picker"
contexts = ["workspace"]
command = ["herdr", "plugin", "pane", "open", "--plugin", "openspec.picker", "--entrypoint", "picker"]
